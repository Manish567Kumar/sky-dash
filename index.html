<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sky Dash</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="wrap">
    <header>
      <h1>Sky Dash</h1>
      <p>Hold <kbd>Space</kbd> / click to climb · dodge the towers · last as long as you can</p>
    </header>
    <canvas id="game" width="960" height="540" aria-label="Sky Dash game"></canvas>
    <p class="hint">Best score is saved on this device.</p>
  </div>
  <script src="game.js"></script>
</body>
</html>
